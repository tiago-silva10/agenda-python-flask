<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contatos</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="container">
            <h1>Agenda de contatos</h1>
            <a href="/adicionar">
                <button class="btn-novo" type="button">+ Adicionar novo contato</button>
            </a>
            <div id="divBusca">
                <input type="text" id="txtBusca" placeholder="Buscar contato"/>
                <img src="{{ url_for('static', filename='img/interrogacao.png') }}" alt="Buscar" id="btnBuscar">
            </div>
            {% if contatos %}
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for contato in contatos %}
                        <tr>
                            <td>{{ contato.nome }}</td>
                            <td>{{ contato.telefone }}</td>
                            <td>{{ contato.email }}</td>
                            <td>{{ contato.endereco }}</td>
                            <td class="coluna-acoes">
                                <a href="/editar/{{ contato.id }}" class="btn-acao editar">Editar</a>
                                <a href="/excluir/{{ contato.id }}" class="btn-acao excluir" onclick="return confirm('Tem certeza que deseja excluir este contato?');">Excluir</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <h3 class="mensagem-vazia">Você ainda não tem contatos na agenda!</h3>
            {% endif %}
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                
                const inputBusca = document.getElementById('txtBusca');
                
                // Verifica se a barra de pesquisa realmente existe na tela
                if (inputBusca) {
                    inputBusca.addEventListener('keyup', function() {
                        let textoBusca = this.value.toLowerCase();
                        
                        // Pega todas as linhas que estão dentro do <tbody>
                        let linhasContatos = document.querySelectorAll('tbody tr');

                        linhasContatos.forEach(function(linha) {
                            // textContent consegue ler todo o texto da linha da tabela de forma mais confiável
                            let textoDaLinha = linha.textContent.toLowerCase();
                            
                            if (textoDaLinha.includes(textoBusca)) {
                                linha.style.display = ''; // Mostra
                            } else {
                                linha.style.display = 'none'; // Esconde
                            }
                        });
                    });
                }
                
            });
        </script>
    </body>
</html>
